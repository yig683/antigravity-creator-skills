[package]
name = "soundcloud-studio"
version = "2.0.0"
edition = "2021"
description = "SC Studio - AI curator and personal edit library"
authors = ["SC Studio"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "query"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mime_guess = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "query", "form", "default-tls"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "net", "time", "process", "io-util"] }
tower-http = { version = "0.7", features = ["fs"] }
urlencoding = "2"

[dependencies.wry]
version = "0.53"
features = ["devtools"]

[dependencies.tao]
version = "0.34"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
